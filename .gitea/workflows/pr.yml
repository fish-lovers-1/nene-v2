name: Pull Request

on:
  pull_request:

jobs:
  pre-commit:
    runs-on: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        working-directory: nene-bot
        run: uv python install

      - name: Install dependencies
        working-directory: nene-bot
        run: uv sync --dev

      - name: Run pre-commit
        working-directory: nene-bot
        run: uv run pre-commit run --all-files

  test:
    runs-on: ci
    uses: ./.gitea/workflows/test.yml

  good-to-merge:
    needs:
      - pre-commit
      - test

    runs-on: ci
    steps:
    - run: true
