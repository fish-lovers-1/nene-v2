name: Test

on:
  workflow_call:

jobs:
  test:
    runs-on: ci

    defaults:
      run:
        working-directory: nene-bot

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest
